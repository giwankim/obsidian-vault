repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        # Obsidian rewrites .obsidian/*.json without a trailing newline; let it.
        exclude: ^\.obsidian/
      - id: trailing-whitespace
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        # nodeenv's default picks nodejs.org's newest entry, even a pre-release
        # it can't parse (v27.0.0-alpha crashed the install).
        language_version: lts
  - repo: local
    hooks:
      - id: sync-readme
        name: sync README.md topic list
        entry: python3 scripts/sync-readme.py
        language: system
        always_run: true
        pass_filenames: false
